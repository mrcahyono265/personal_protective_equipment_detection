<!-- templates/index.html - Frontend Dashboard (Refactored) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteGazer - Drone Safety Monitoring System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Modal untuk menampilkan gambar full-size -->
    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img class="modal-image" id="modalImage" src="" alt="Full Size Snapshot">
            <div class="modal-info">
                <div class="modal-info-row">
                    <span class="modal-info-label">Timestamp:</span>
                    <span class="modal-info-value" id="modalTimestamp">--:--:--</span>
                </div>
                <div class="modal-info-row">
                    <span class="modal-info-label">Status:</span>
                    <span class="modal-info-value" id="modalStatus">Unknown</span>
                </div>
                <div class="modal-info-row">
                    <span class="modal-info-label">Zone:</span>
                    <span class="modal-info-value" id="modalZone">Unknown Zone</span>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Left Panel: Video Stream -->
        <div class="video-panel">
            <div class="header">
                <div class="logo">
                    <i class="fas fa-drone"></i>
                    <h1>SiteGazer AI</h1>
                </div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Live Monitoring Active</span>
                </div>
            </div>

            <div class="video-container">
                <img id="videoStream" src="/video_feed" alt="Live Video Feed">
                <div class="loading" id="loadingIndicator" style="display: none;">
                    <div class="spinner"></div>
                    <p>Starting video stream...</p>
                </div>
            </div>

            <div class="zone-controls">
                <button class="zone-btn" onclick="changeZone('Lobby')">
                    <i class="fas fa-building"></i>
                    Zone: Lobby
                </button>
                <button class="zone-btn" onclick="changeZone('Warehouse')">
                    <i class="fas fa-warehouse"></i>
                    Zone: Warehouse
                </button>
                <button class="zone-btn" onclick="changeZone('Site')">
                    <i class="fas fa-hard-hat"></i>
                    Zone: Site
                </button>
            </div>
        </div>

        <!-- Right Panel: Live Security Log -->
        <div class="log-panel">
            <div class="log-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Live Security Log</h2>
                <div class="log-count" id="logCount">0</div>
            </div>

            <div class="log-container" id="logContainer">
                <!-- Log entries will be dynamically inserted here -->
                <div class="log-card info">
                    <div class="log-time">
                        <i class="far fa-clock"></i>
                        <span id="currentTime">--:--:--</span>
                    </div>
                    <div class="log-content">
                        <div class="log-status">System Initialized</div>
                    </div>
                    <div class="log-zone">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Zone: <span id="currentZoneDisplay">Unknown Zone</span></span>
                    </div>
                </div>
            </div>

            <div class="system-stats">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalDetections">0</div>
                        <div class="stat-label">Total Detections</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="criticalCount">0</div>
                        <div class="stat-label">Critical Alerts</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="snapshotCount">0</div>
                        <div class="stat-label">Snapshots Saved</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="activePersons">0</div>
                        <div class="stat-label">Active Persons</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
